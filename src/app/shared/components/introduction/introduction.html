<section class="intro">

  <!-- ENCABEZADO EDITORIAL -->

  <div class="intro-header">

    <h2 class="intro-title">

      {{
        state.t(
          'Donde la historia',
          'Where history'
        )
      }}

      <br />

      {{ state.t('encuentra', 'meets') }}

      <em>
        {{ state.t('al mar.', 'the sea.') }}
      </em>

    </h2>

  </div>

  <!-- GALERÍA EDITORIAL -->

  <div class="postcards-gallery">

    @for (postcard of postcards; track postcard.id; let i = $index) {

      <figure
        class="memory-card"
        [class]="'memory-card memory-card-' + (i + 1)"
        [style.--index]="i"
      >

        <!-- FOTOGRAFÍA -->

        <div class="memory-image">

          <img
            [src]="imageUrl(postcard.file)"
            [alt]="state.t(postcard.altEs, postcard.altEn)"
            [style.object-position]="postcard.position"
            loading="lazy"
            decoding="async"
            width="800"
            height="1000"
          />

        </div>

        <!-- DESTINO -->

        <figcaption class="memory-caption">

          <div class="memory-information">

            <h3>
              {{ postcard.name }}
            </h3>

            <p>

              {{
                state.t(
                  postcard.descriptionEs,
                  postcard.descriptionEn
                )
              }}

            </p>

          </div>

          <span
            class="memory-number"
            aria-hidden="true"
          >

            {{ formatNumber(i) }}

          </span>

        </figcaption>

        <!-- CRÉDITOS FOTOGRÁFICOS -->

        <div class="photo-credit">

          <a
            [href]="sourceUrl(postcard.file)"
            target="_blank"
            rel="noopener noreferrer"
          >

            {{ postcard.author }}

          </a>

          <span> · </span>

          <a
            [href]="licenseUrl(postcard.license)"
            target="_blank"
            rel="noopener noreferrer"
          >

            CC BY-SA {{ postcard.license }}

          </a>

          <span>
            · {{ state.t('Vista recortada', 'Cropped view') }}
          </span>

        </div>

      </figure>

    }

  </div>

</section>
